<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C6 Conexão PJ · Hora a hora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F2F2F2; --panel:#FFFFFF; --panel-2:#F7F7F7; --ink:#121212; --muted:#5F5F5F; --line:#E0E0E0;
  --teal:#121212; --teal-soft:#F6EDC4; --amber:#D4A900; --amber-soft:#FBF3D0; --red:#B23A48; --red-soft:#F6DDE0;
  --slate:#9A9A9A; --on-accent:#FFFFFF; --gold:#C79A00;
  --f-body:"Barlow", "Segoe UI", Roboto, Arial, sans-serif;
  --f-num:"Barlow Semi Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A; --panel:#151515; --panel-2:#1C1C1C; --ink:#F2F2F2; --muted:#A6A6A6; --line:#2A2A2A;
    --teal:#F2C200; --teal-soft:#3A3010; --amber:#F2C200; --amber-soft:#3A3010; --red:#E06B78; --red-soft:#3B1D22; --slate:#6E6E6E; --on-accent:#121212; --gold:#F2C200;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --panel:#151515; --panel-2:#1C1C1C; --ink:#F2F2F2; --muted:#A6A6A6; --line:#2A2A2A;
    --teal:#F2C200; --teal-soft:#3A3010; --amber:#F2C200; --amber-soft:#3A3010; --red:#E06B78; --red-soft:#3B1D22; --slate:#6E6E6E; --on-accent:#121212; --gold:#F2C200;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding:20px clamp(12px,3vw,32px) 48px}

/* topo */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand h1{margin:0;font:700 clamp(24px,3.2vw,34px)/1.05 var(--f-num);letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.meta{color:var(--muted);font-size:13px;text-align:right;line-height:1.35}
.meta b{color:var(--ink);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--slate)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.55;cursor:progress}
.toast{font-size:13px;color:var(--muted);min-height:18px}
.toast.err{color:var(--red)}
.toast.ok{color:var(--teal)}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:18px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.fdate{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.fdate input{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:5px 8px;font-size:13px;color:var(--ink)}
.quick{display:flex;gap:4px}
.quick button{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:5px 8px;font-size:12.5px;cursor:pointer}
.quick button.on{background:var(--teal-soft);border-color:var(--teal);color:var(--ink)}
@media (max-width:700px){.filters{position:static}.sep{display:none}}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.ms{position:relative}
.ms > button{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:5px 10px;font-size:13px;cursor:pointer;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms > button.active{border-color:var(--teal);background:var(--teal-soft)}
.ms > button .lab{color:var(--muted)}
.pop{position:absolute;top:calc(100% + 6px);left:0;width:300px;max-width:88vw;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(10,20,30,.18);padding:10px;z-index:40;display:none}
.ms.open .pop{display:block}
.pop input[type=search]{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:6px 8px;font-size:13px;margin-bottom:8px}
.pop .row{display:flex;gap:6px;margin-bottom:6px}
.pop .row button{flex:1;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:4px;font-size:12px;cursor:pointer}
.pop ul{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
.pop li label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;font-size:13px;cursor:pointer}
.pop li label:hover{background:var(--panel-2)}
.clear{margin-left:auto;font-size:13px;border:0;background:none;color:var(--teal);cursor:pointer;padding:4px 6px}

/* funil */
.funnel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.05fr);background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.stage{padding:18px 20px 16px;position:relative;border-right:1px solid var(--line)}
.stage:last-child{border-right:0;background:var(--panel-2)}
.stage .name{font-size:13.5px;color:var(--muted);font-weight:500}
.stage .val{font:700 clamp(28px,3.4vw,42px)/1.05 var(--f-num);margin-top:4px;font-variant-numeric:tabular-nums}
.stage .sub{font-size:13px;color:var(--muted);margin-top:4px}
.stage .sub b{color:var(--ink);font-weight:600}
.stage .step{position:absolute;right:-13px;top:50%;transform:translateY(-50%);z-index:2;width:26px;height:26px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.stage.sale .val{color:var(--amber)}
.stage.sale{background:linear-gradient(0deg,var(--amber-soft),transparent 70%)}
.tma{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tma .val{font-size:clamp(24px,2.6vw,32px)}
@media (max-width:900px){
  .funnel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage{border-bottom:1px solid var(--line)}
  .stage .step{display:none}
  .stage:last-child{grid-column:1/-1}
}

/* abas */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--teal)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font:600 18px/1.2 var(--f-num);margin:0 0 4px}
.card .hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.chartbox{position:relative;height:300px}
.bar-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.bar-head input[type=search]{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:6px 10px;font-size:13px;min-width:220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--panel-2);padding:5px 10px;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--teal);color:var(--on-accent)}

/* tabelas */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{position:sticky;top:0;background:var(--panel-2);font-weight:600;font-size:12.5px;color:var(--muted);text-align:left;cursor:pointer;user-select:none}
thead th.num,td.num{text-align:center;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:14px}
thead th.num{font-family:var(--f-body);font-size:12.5px}
thead th .arr{opacity:.35;margin-left:3px}
thead th.sorted{color:var(--ink)}
thead th.sorted .arr{opacity:1}
tbody tr:hover{background:var(--panel-2)}
tfoot td{font-weight:600;background:var(--panel-2);border-bottom:0}
td.name{max-width:320px;overflow:hidden;text-overflow:ellipsis}
tr.child td{background:var(--panel-2);font-size:13px}
tr.child td.name{padding-left:30px;color:var(--muted)}
.exp{border:0;background:none;cursor:pointer;width:18px;padding:0;color:var(--muted);font-size:11px}
.zero{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:middle}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.tag.t-SUCESSO{background:var(--amber-soft);border-color:transparent;color:var(--ink)}
.tag.t-EMNEG{background:var(--teal-soft);border-color:transparent;color:var(--ink)}
.tag.t-TEL{background:transparent}
.tag.t-REC{background:var(--red-soft);border-color:transparent;color:var(--ink)}
.qt{display:inline-block;min-width:30px;text-align:center;font:600 12.5px/1.5 var(--f-num);padding:0 7px;border-radius:10px}
.qt.q1{background:var(--teal);color:#fff}.qt.q2{background:var(--teal-soft);color:var(--ink)}
.qt.q3{background:var(--amber-soft);color:var(--ink)}.qt.q4{background:var(--red-soft);color:var(--ink)}
.tabbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tabsum{font-size:13.5px;color:var(--muted);margin:0 0 12px}.tabsum b{color:var(--ink)}
.pbar{display:inline-block;height:6px;border-radius:3px;background:var(--teal);vertical-align:middle;margin-left:8px;opacity:.75}
td.heat{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}

/* vazio */
.empty{background:var(--panel);border:1px dashed var(--slate);border-radius:12px;padding:40px 28px;max-width:680px;margin:40px auto;text-align:left}
.empty h2{font:600 22px/1.2 var(--f-num);margin:0 0 10px}
.empty ol{margin:0 0 18px;padding-left:20px;color:var(--muted)}
.empty ol li{margin:4px 0}
.empty code{background:var(--panel-2);padding:1px 6px;border-radius:5px;font-size:13px}
.hidden{display:none!important}
th.dlt{font-size:11.5px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--teal)}
th.sorted{color:var(--teal)}
.ms .ms-busca{width:100%;margin:0 0 6px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;background:var(--panel-2);color:var(--ink)}
table.rk td.name{max-width:520px;white-space:normal}
table.rk td.good,table.rk td.bad{font-weight:600}
.acs-form{display:grid;grid-template-columns:1.2fr 1.4fr .9fr 1.2fr auto;gap:10px;align-items:end}
@media (max-width:1000px){.acs-form{grid-template-columns:1fr 1fr}}
.acs-form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.acs-form input,.acs-form select{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:7px 9px;font-size:14px;color:var(--ink)}
.acs-senha{display:flex;gap:6px}.acs-senha input{flex:1;min-width:0}
.acs-ok{background:var(--teal-soft);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:13.5px;white-space:pre-line}
.acs-ok b{font-family:var(--f-num)}
.acs-tbl td,.acs-tbl th{font-size:13px}
.acs-tbl .acts{display:flex;gap:6px;justify-content:flex-end}
.acs-tbl .acts button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer}
.acs-tbl .acts button.del{color:var(--red)}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
.pill.adm{background:var(--amber-soft);border-color:transparent}
.pill.ok{background:var(--teal-soft);border-color:transparent}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:22px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(10,20,30,.45)}
dialog h2{font:600 20px/1.2 var(--f-num);margin:0 0 6px}
dialog label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
dialog input{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:8px 10px;color:var(--ink)}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.drop{outline:2px dashed var(--teal);outline-offset:-8px}
@media (prefers-reduced-motion:no-preference){.stage .val{transition:color .2s}}
/* ---- extrato (layout da planilha) ---- */
.ctrl{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.ctrl label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.ctrl select{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:6px 10px;font-size:14px;color:var(--ink);min-width:170px}
.kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.kpi{padding:14px 16px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .n{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font:700 clamp(20px,2.2vw,28px)/1.1 var(--f-num);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.proj{background:var(--panel-2)}
.kpi.proj .v{color:var(--teal)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kpi{border-bottom:1px solid var(--line)}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.blk{margin-bottom:20px}
.blk h2{font:700 17px/1.2 var(--f-num);margin:0 0 8px;letter-spacing:.01em}
table.x{font-size:12.5px}
table.x th,table.x td{padding:5px 7px}
table.x td.name{max-width:210px;width:210px}
table.x td.num{font-size:13px}
.wrap{max-width:1760px}
table.x thead tr.grp th{background:transparent;border-bottom:0;padding-bottom:2px;font-size:12px;color:var(--ink);cursor:default}
table.x thead tr.grp th.g-real{border-bottom:2px solid var(--slate)}
table.x thead tr.grp th.g-proj{border-bottom:2px solid var(--teal);color:var(--teal)}
table.x thead th{cursor:default;white-space:normal;vertical-align:bottom;line-height:1.2}
table.x td.sepl,table.x th.sepl{border-left:2px solid var(--line)}
table.x td.pj{background:color-mix(in srgb,var(--teal) 5%,transparent)}
table.x tfoot td.pj{background:var(--panel-2)}
td.good{color:var(--teal);font-weight:600}
td.bad{color:var(--red);font-weight:600}
td.dim{color:var(--muted)}
.legend2{font-size:12.5px;color:var(--muted);margin:-8px 0 16px}
.legend2 b{color:var(--ink)}

/* ---- v11: logo e tabelas compactas ---- */
.brand h1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo img{height:34px;width:auto;display:block}
.wrap{max-width:none}
table.x{font-size:11.5px}
table.x th,table.x td{padding:4px 5px}
table.x td.num{font-size:12px}
table.x thead th{font-size:11px}
table.x td.name{max-width:190px;width:190px}
.ctrl select{min-width:140px}
/* ---- v10: filtros, abas, blocos altos, mapa ---- */
.ctrl .ms > button{min-width:170px;text-align:left}
.ctrl .clear{align-self:center}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.jump a{font-size:12.5px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:3px 10px}
.jump a:hover{border-color:var(--teal)}
.blk{scroll-margin-top:12px}
.tscroll.tall{max-height:560px;overflow:auto}
.tscroll.tall thead th{position:sticky;top:0;z-index:1}
select.sel{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:5px 8px;font-size:13px;color:var(--ink)}
.hm{border-collapse:separate;border-spacing:2px;width:100%;font-size:11.5px}
.hm th{font-weight:600;color:var(--muted);padding:4px 6px;text-align:center;white-space:nowrap}
.hm th.rl{text-align:left}
.hm td{padding:6px 2px;text-align:center;border-radius:4px;min-width:44px;font-variant-numeric:tabular-nums}
.hm td.rl{text-align:left;background:none;font-weight:600;color:var(--ink,inherit);padding-right:10px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--teal);color:var(--on-accent)}
.hbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal);font-weight:600}
.warnbox{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.mapwrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.mapwrap{grid-template-columns:minmax(0,1fr)}}
.mapcard{position:relative}
.map{position:relative;max-width:640px;margin:0 auto}
.map svg{width:100%;height:auto;display:block}
.map path{stroke:var(--panel);stroke-width:.8;cursor:pointer;transition:opacity .15s}
.map path:hover{opacity:.78;stroke:var(--ink);stroke-width:1.2}
.map text.uf{font:600 10px var(--f-body);fill:var(--ink);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--panel);stroke-width:2.5px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 8px 24px rgba(10,20,30,.18);white-space:nowrap;z-index:5}
.leg{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--muted);margin-top:8px}
.leg i{display:inline-block;width:180px;height:10px;border-radius:5px}
.spgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spcard{background:var(--panel-2);border-radius:10px;padding:12px 14px}
.spcard .n{font-size:12.5px;color:var(--muted);font-weight:600}
.spcard .v{font:700 26px/1.1 var(--f-num);margin-top:4px}
.spcard .v span{font:500 13px var(--f-body);color:var(--muted)}
.spcard .s{font-size:12px;color:var(--muted);margin-top:4px}

.qcards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:1100px){.qcards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.qc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:4px solid var(--qc)}
.qc .n{font:700 15px/1 var(--f-num);color:var(--qc)}
.qc .v{font:700 24px/1.1 var(--f-num);margin-top:6px;font-variant-numeric:tabular-nums}
.qc .s{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.qp{display:inline-block;min-width:26px;text-align:center;padding:1px 7px;border-radius:9px;font-weight:700;font-size:11.5px;color:#fff;background:var(--qc)}
.ctrl input[type=number],.ctrl input[type=search]{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:6px 10px;font-size:14px;color:var(--ink);width:120px}
.ctrl input[type=search]{width:220px}
table.x th.sort{cursor:pointer;user-select:none}
table.x th.sort:hover{color:var(--teal)}
.chart{width:100%;height:auto;display:block}
.chart text{font:11px var(--f-body, sans-serif);fill:var(--muted)}
.leg2{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.leg2 i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-2px}
.mtx td.c{text-align:center}
/* identidade C6: faixa preta no topo, detalhes em amarelo */
header.top{background:#121212;color:#F2F2F2;border-radius:14px;padding:18px 22px;align-items:center}
header.top .brand p,header.top .meta{color:#BDBDBD}
header.top .meta b{color:#F2F2F2}
header.top .brand h1{color:#FFFFFF}
header.top .brand h1::after{content:"";display:block;width:56px;height:4px;border-radius:2px;background:#F2C200;margin-top:8px}
header.top .btn{background:#1E1E1E;border-color:#3A3A3A;color:#F2F2F2}
header.top .btn.primary{background:#F2C200;border-color:#F2C200;color:#121212}
.tabs button.on{border-bottom-color:var(--gold)!important}
header.top{display:grid!important;grid-template-columns:auto 1fr auto auto;gap:22px}
header.top .lg{display:flex;align-items:center}
header.top .lg img{height:56px;width:auto;display:block;border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
header.top .lg-c6{padding-right:22px;border-right:1px solid #333}
header.top .lg-act{padding-left:22px;border-left:1px solid #333}
header.top .lgtxt{font:600 15px var(--f-body);color:#BDBDBD;letter-spacing:.02em}
@media (max-width:900px){header.top{grid-template-columns:auto 1fr auto}header.top .actions{grid-column:1/-1}}
/* linhas de percentual sempre grifadas */
/* % : faixa fina dourada + fundo bem leve + numero em dourado escuro */
:root{--pct-bg:rgba(212,169,0,.07);--pct-ink:#8A6A00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pct-bg:rgba(242,194,0,.07);--pct-ink:#F2C200}}
:root[data-theme="dark"]{--pct-bg:rgba(242,194,0,.07);--pct-ink:#F2C200}
tr.pctrow td{background:var(--pct-bg)!important}
tr.pctrow td.num{color:var(--pct-ink)!important;font-weight:600}
tr.pctrow td.name{color:var(--ink)!important;font-style:normal;font-weight:500;box-shadow:inset 3px 0 0 var(--gold)}
td.pctcol{background:var(--pct-bg)!important;color:var(--pct-ink)!important;font-weight:600}
td.pctcol.good{color:#1E8449!important} td.pctcol.bad{color:var(--red)!important}
/* coluna fixa (Indicador) precisa de fundo OPACO, senao os numeros aparecem por baixo ao rolar */
table.dia2 td.stick,table.dia2 th.stick{background:var(--panel)!important;z-index:3}
table.dia2 tr.pctrow td.stick{background:linear-gradient(var(--pct-bg),var(--pct-bg)),var(--panel)!important}
table.dia2 tr.destaque td.stick{background:linear-gradient(var(--amber-soft),var(--amber-soft)),var(--panel)!important}
/* consolidado do mes + filtro de safras */
.kbar{display:flex;align-items:center;gap:10px;margin:14px 0 8px;font-size:14px}
.kbar .sel,.fsafra{border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--panel);color:var(--ink);font:inherit}
th .st{display:block;font-size:10px;font-weight:600;letter-spacing:.02em;margin-top:2px}
th .st.on{color:#1E8449} th .st.off{color:var(--muted)}

#view table.fit th,#view table.fit td{text-align:center}
#view table.fit th:first-child,#view table.fit td:first-child{text-align:left}
</style>
</head>

(() => {

/* ================= HORA A HORA C6 CONEXAO PJ ================= */
const OPS = ["PJ CORRENTISTA","PJ NAO CORRENTISTA","PJ ATIVACAO"];
const OPN = { "ABERTURA":"Consolidado abertura de conta", "PJ CORRENTISTA":"PJ Correntista", "PJ NAO CORRENTISTA":"PJ Não Correntista", "PJ ATIVACAO":"PJ Ativação" };

const opsDe = op => (op || S.op || ABER) === ABER ? [CORR, NCOR] : [op || S.op];
const MET = ["DISCAGEM","ALO","CONTATO_EFETIVO","CPC","SUCESSO","TEMPO_FALADO_SEG","AGENTES_ATENDENDO","AGENTES_LOGADOS","LOGADO_SEG","PAUSA_SEG"];
const S = { tabModo:"n", tabSort:{ k:"tot", d:-1 }, cfg:{}, editMeta:false, rows:null, tab:[], meta:null, loadedAsset:null, datas:[], data:"", op:"", view:"hh", atualizado:"" };
const fD = iso => iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) : "–";
const fDelta = v => !isFinite(v) ? "–" : (v >= 0 ? "+" : "−") + fPct(Math.abs(v), 0);
const corD = v => !isFinite(v) ? "inherit" : v >= 0 ? "#1E8449" : "#C0392B";

/* ================= LEITURA ================= */
const normKey = k => String(k).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\u00a0/g, " ").trim().toUpperCase().replace(/\s+/g, "_");
const num = v => { if (v == null || v === "") return 0; if (typeof v === "number") return v; const n = Number(String(v).replace(/\./g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
const clean = v => v == null ? "" : String(v).replace(/\u00a0/g, " ").trim();
function isoDate(v){
  if (v == null || v === "") return "";
  if (v instanceof Date && !isNaN(v)) return new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  if (typeof v === "number" && v > 20000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
  const t = String(v).trim(); let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[1] + "-" + m[2] + "-" + m[3];
  m = t.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if (m) return m[3] + "-" + m[2] + "-" + m[1]; return "";
}
const CONS = "PJ CONSOLIDADO";
const opNorm = v => { const t = normKey(v).replace(/_/g, " "); return t.includes("CONSOL") ? CONS : t.includes("ATIV") ? "PJ ATIVACAO" : t.includes("NAO") ? "PJ NAO CORRENTISTA" : "PJ CORRENTISTA"; };
async function readFile(file){
  const name = file.name.toLowerCase(); let wb;
  if (name.endsWith(".csv") || name.endsWith(".txt")){
    const text = await file.text(); const first = text.split(/\r?\n/, 1)[0];
    const cnt = ch => first.split(ch).length - 1;
    const FS = [["\t",cnt("\t")],[";",cnt(";")],[",",cnt(",")]].sort((a,b) => b[1]-a[1])[0][0];
    wb = XLSX.read(text, { type:"string", FS, raw:true });
  } else wb = XLSX.read(await file.arrayBuffer(), { type:"array", cellDates:true });
  const out = { main:null, tab:null };
  for (const sn of wb.SheetNames){
    const r = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval:null, raw:true });
    if (!r.length) continue;
    const keys = Object.keys(r[0]).map(normKey);
    if (keys.includes("DATA_REF") && keys.includes("HORA") && keys.includes("DISCAGEM")) out.main = r;
    else if (keys.includes("DATA_REF") && keys.includes("STATUS") && keys.includes("QTD")) out.tab = r;
  }
  if (!out.main && !out.tab) throw new Error("Não encontrei as colunas DATA_REF, HORA e DISCAGEM. Exporte a tabela dbo.C6_CXPJ_HORA_HORA.");
  return out;
}
function encode(lido){
  const pega = (rows, f) => { if (!rows) return null; const km = {}; Object.keys(rows[0]).forEach(k => km[normKey(k)] = k); return rows.map(r => f(r, km)).filter(Boolean); };
  const main = pega(lido.main, (r, km) => { const d = isoDate(r[km.DATA_REF]); if (!d) return null;
    const o = { DATA:d, HORA:num(r[km.HORA]), OP:opNorm(r[km.OPERACAO]), META:num(r[km.META_DIA]), HI:km.HORA_INI ? num(r[km.HORA_INI]) : 9, HF:km.HORA_FIM ? num(r[km.HORA_FIM]) : 19,
      ATU:km.ATUALIZADO_EM ? atuLocal(r[km.ATUALIZADO_EM]) : "" };
    MET.forEach(m => o[m] = km[m] ? num(r[km[m]]) : 0); return o; });
  const tab = pega(lido.tab, (r, km) => { const d = isoDate(r[km.DATA_REF]); if (!d) return null;
    return { DATA:d, HORA:num(r[km.HORA]), OP:opNorm(r[km.OPERACAO]), TIPO:clean(r[km.TIPO]), STATUS:clean(r[km.STATUS]), QTD:num(r[km.QTD]), TEMPO:num(r[km.TEMPO_FALADO_SEG]) }; });
  /* arquivo so com tabulacoes: mantem a base hora a hora atual */
  return { v:"h1", main:main || (S.rows || []), tab:tab || (main ? [] : S.tab || []) };
}

function load(enc, meta){

}

}

/* ================= CALCULO ================= */
function soma(rows){ const a = {}; MET.forEach(m => a[m] = 0); rows.forEach(r => MET.forEach(m => a[m] += r[m])); return a; }

const HCF = ["AGENTES_LOGADOS","LOGADO_SEG","PAUSA_SEG","AGENTES_ATENDENDO"];
function horasDia(d){ return Array.from(new Set(S.rows.filter(r => r.DATA === d && daOp(r)).map(r => r.HORA))).sort((a, b) => a - b); }
function porHora(d, op){
  const lst = opsDe(op);
  const m = new Map(); S.rows.filter(r => r.DATA === d && lst.includes(r.OP)).forEach(r => { const a = m.get(r.HORA) || (m.set(r.HORA, soma([])), m.get(r.HORA)); MET.forEach(k => a[k] += r[k]); });
  if (lst.length > 1){   /* abertura de conta: Correntista e Nao Correntista sao a MESMA equipe -> HC de uma linha so (nao soma) */
    m.forEach(a => HCF.forEach(k => a[k] = 0));

  }

}

/* data/hora da atualizacao no horario LOCAL ("aaaa-mm-dd hh:mm:ss"), aceitando texto, data do Excel ou numero serial */
function atuLocal(v){
  const p2 = n => String(n).padStart(2, "0");
  const fmt = d => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) + " " + p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
  if (v instanceof Date) return fmt(v);   /* o Excel converte para data: usa a hora local, nunca UTC */
  if (typeof v === "number" && isFinite(v)){ const ms = Math.round((v - 25569) * 86400000); const u = new Date(ms); return fmt(new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate(), u.getUTCHours(), u.getUTCMinutes(), u.getUTCSeconds())); }
  const t = clean(v).replace("T", " "); const m = t.match(/^(\d{4})-(\d{2})-(\d{2})[ ](\d{2}):(\d{2})/) || t.match(/^(\d{2})\/(\d{2})\/(\d{4})[ ](\d{2}):(\d{2})/);
  if (!m) return t;
  return m[1].length === 4 ? m[1] + "-" + m[2] + "-" + m[3] + " " + m[4] + ":" + m[5] + ":00" : m[3] + "-" + m[2] + "-" + m[1] + " " + m[4] + ":" + m[5] + ":00";
}
/* hora em andamento (nao exibida): no dia de hoje, a menor entre a hora da ultima atualizacao e a hora do relogio */
function horaAtual(d){
  const ultimo = d === S.datas[S.datas.length - 1];
  const hoje = (() => { const n = new Date(), p2 = x => String(x).padStart(2, "0"); return n.getFullYear() + "-" + p2(n.getMonth() + 1) + "-" + p2(n.getDate()); })();
  let h = 99;
  if (ultimo && S.atualizado){ const x = +S.atualizado.slice(11, 13); if (isFinite(x)) h = x; }
  if (d === hoje) h = Math.min(h, new Date().getHours());
  return h;
}
function metaCfg(op){ const c = S.cfg || {}, d = c.metas && c.metas[S.data]; if (d && d[op] != null) return +d[op]; if (c.padrao && c.padrao[op] != null) return +c.padrao[op]; return null; }
function cfgOp(op){
  if (op === ABER){ const a = cfgOp(CORR), b = cfgOp(NCOR); return { meta:a.meta + b.meta, hi:a.hi, hf:a.hf }; }
  const r = S.rows.find(x => x.OP === op && x.DATA === S.data) || S.rows.find(x => x.OP === op) || {};

function resumoOp(op){
  const d = S.data, cmp = comparacao(d), hAt = horaAtual(d), c = cfgOp(op);
  const hoje = porHora(d, op), vHoje = Array.from(hoje.values()).reduce((s, a) => s + a.SUCESSO, 0);
  const fechadas = Array.from(hoje.keys()).filter(h => h < hAt && h >= c.hi && h <= c.hf).length || 0;
  const totH = c.hf - c.hi + 1, ateH = h => h < hAt;
  const vFech = Array.from(hoje.entries()).filter(([h]) => ateH(h)).reduce((s, [, a]) => s + a.SUCESSO, 0);
  const proj = hAt >= 99 ? vHoje : (fechadas ? vFech / fechadas * totH : vHoje);
  const somaAte = dd => Array.from(porHora(dd, op).entries()).filter(([h]) => hAt >= 99 || h < hAt).reduce((s, [, a]) => s + a.SUCESSO, 0);
  const d1 = cmp.d1 ? somaAte(cmp.d1) : NaN, m7 = cmp.d7.length ? cmp.d7.reduce((s, dd) => s + somaAte(dd), 0) / cmp.d7.length : NaN;
  return { op, meta:c.meta, vHoje, proj, ating:div(proj, c.meta), d1, m7, vsD1:div(vFechOuTudo(vHoje, vFech, hAt), d1) - 1, vsM7:div(vFechOuTudo(vHoje, vFech, hAt), m7) - 1, cmp, hAt };
}
const vFechOuTudo = (v, vf, h) => h >= 99 ? v : vf;

function viewAcum(R){
  const d = S.data, cmp = comparacao(d), ops = opsDe("");

  const acum = dd => { let s = 0; const m = new Map(); S.rows.filter(r => r.DATA === dd && ops.includes(r.OP)).forEach(r => m.set(r.HORA, (m.get(r.HORA) || 0) + r.SUCESSO)); return hs.map(h => (s += (m.get(h) || 0))); };

async function handleFile(file, persist){
  if (!file) return;
  try {
    toast("Lendo " + file.name + "…");
    const enc = encode(await readFile(file)); if (!encLen(enc)) throw new Error("O arquivo não tem linhas.");
    if (persist && logged && sb){
      toast("Publicando a base…");
      const body = JSON.stringify(enc), path = PAINEL + "/" + Date.now() + ".json";
      const upr = await sb.storage.from(BUCKET).upload(path, new Blob([body], { type:"application/json" }), { contentType:"application/json", cacheControl:"31536000", upsert:false });
      if (upr.error) throw upr.error;
      const prev = S.meta && S.meta.path;
      const mr = await sb.from("painel_base_meta").upsert({ painel:PAINEL, arquivo:file.name, linhas:encLen(enc), storage_path:path, tamanho_bytes:body.length, atualizado_em:new Date().toISOString() }).select().single();
      if (mr.error){ await sb.storage.from(BUCKET).remove([path]); throw mr.error; }
      S.loadedAsset = path; load(enc, toMeta(mr.data));
      if (prev && prev !== path) sb.storage.from(BUCKET).remove([prev]).catch(() => {});
      toast("Base atualizada para todos: " + fInt(encLen(enc)) + " linhas.", "ok");
    } else { S.loadedAsset = null; load(enc, null); toast("Arquivo aberto só nesta tela.", "ok"); }
  } catch (e){ const m = (e && (e.message || e.error)) || ""; toast(/row-level security|Unauthorized|403/i.test(m) ? "Seu usuário não tem permissão para atualizar a base." : m || "Não foi possível ler o arquivo.", "err"); }
  finally { $("#file").value = ""; }
}
let persistNext = false;
$("#btnUp").onclick = () => { persistNext = true; $("#file").click(); };
$("#btnLocal").onclick = () => { persistNext = false; $("#file").click(); };
$("#file").onchange = e => handleFile(e.target.files[0], persistNext);
$("#btnTheme").onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("c6pj-theme", r.dataset.theme); } catch(_){} refresh(); };
try { const th = localStorage.getItem("c6pj-theme"); if (th) document.documentElement.dataset.theme = th; } catch(_){}
function showEmpty(t, b){ $("#main").classList.add("hidden"); $("#emptyState").classList.remove("hidden"); $("#emptyTitle").textContent = t; $("#emptyBody").innerHTML = b || ""; }
/* ---------- gestao de acessos (so administradores) ---------- */
const gerarSenha = () => { const c = "ABCDEFGHJKMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789"; let r = "";
  const a = new Uint32Array(10); crypto.getRandomValues(a); a.forEach(x => r += c[x % c.length]); return r; };
const fData = d => d ? new Date(d).toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" }) : "–";
async function chamarAcessos(body){
  const { data, error } = await sb.functions.invoke("painel-acessos", { body });
  if (error){
    let msg = error.message || "Erro ao chamar a função painel-acessos.";
    try { const j = await error.context.json(); if (j && j.erro) msg = j.erro; } catch(_){}
    if (/not found|404|Failed to send/i.test(msg)) msg = "A função painel-acessos não foi encontrada no Supabase. Confira o passo de criação da Edge Function.";
    throw new Error(msg);
  }
  if (data && data.erro) throw new Error(data.erro);
  return data;
}
let ultimoCadastro = "";
async function renderAcessos(){
  const v = $("#view");
  v.innerHTML = '<div class="card"><h2>Liberar acesso</h2><p class="hint">Cria o login da pessoa e libera o painel. Leitor só visualiza; administrador também atualiza a base e gerencia acessos.</p>'
    + '<div class="acs-form">'
    + '<label>Nome<input id="aNome" placeholder="Nome da pessoa"></label>'
    + '<label>E-mail<input id="aEmail" type="email" placeholder="pessoa@empresa.com"></label>'
    + '<label>Perfil<select id="aPapel"><option value="LEITOR">Leitor</option><option value="ADMIN">Administrador</option></select></label>'
    + '<label>Senha<span class="acs-senha"><input id="aSenha" value="' + gerarSenha() + '"><button class="btn ghost" type="button" id="aGerar">Gerar</button></span></label>'
    + '<button class="btn primary" type="button" id="aCriar">Liberar acesso</button></div>'
    + (ultimoCadastro ? '<div class="acs-ok" id="aOk">' + ultimoCadastro + '<br><button class="btn ghost" type="button" id="aCopiar" style="margin-top:8px">Copiar dados de acesso</button></div>' : '')
    + '</div><div class="card"><h2>Quem tem acesso</h2><div id="aLista"><p class="hint">Carregando…</p></div></div>';
  $("#aGerar").onclick = () => { $("#aSenha").value = gerarSenha(); };
  if ($("#aCopiar")) $("#aCopiar").onclick = () => { navigator.clipboard.writeText(ultimoCadastro.replace(/<[^>]+>/g, "")).then(() => toast("Dados copiados.", "ok")); };
  $("#aCriar").onclick = async () => {
    const email = $("#aEmail").value.trim(), senha = $("#aSenha").value.trim(), nome = $("#aNome").value.trim(), papel = $("#aPapel").value;
    const b = $("#aCriar"); b.disabled = true; toast("Liberando acesso…");
    try {
      await chamarAcessos({ acao:"criar", email, senha, nome, papel });
      ultimoCadastro = "Acesso liberado para <b>" + esc(nome || email) + "</b>.\nLink: " + esc(location.origin + location.pathname)
        + "\nE-mail: " + esc(email) + "\nSenha: " + esc(senha);
      toast("Acesso liberado.", "ok"); renderAcessos();
    } catch(e){ toast(e.message, "err"); b.disabled = false; }
  };
  try {
    const { lista, eu } = await chamarAcessos({ acao:"listar" });
    lista.sort((a,b) => (a.papel === b.papel ? 0 : a.papel === "ADMIN" ? -1 : 1) || String(a.nome || a.email).localeCompare(String(b.nome || b.email), "pt-BR"));
    $("#aLista").innerHTML = '<div class="tscroll"><table class="acs-tbl"><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Situação</th><th>Último acesso</th><th>Liberado em</th><th></th></tr></thead><tbody>'
      + lista.map(x => '<tr><td>' + esc(x.nome || "–") + '</td><td>' + esc(x.email) + '</td>'
        + '<td><span class="pill' + (x.papel === "ADMIN" ? " adm" : "") + '">' + (x.papel === "ADMIN" ? "Administrador" : "Leitor") + '</span></td>'
        + '<td>' + (!x.tem_login ? '<span class="pill">Sem login criado</span>' : x.ultimo_acesso ? '<span class="pill ok">Ativo</span>' : '<span class="pill">Nunca entrou</span>') + '</td>'
        + '<td>' + fData(x.ultimo_acesso) + '</td><td>' + fData(x.liberado_em) + '</td>'
        + '<td><div class="acts">' + (x.tem_login ? '<button data-a="senha" data-e="' + esc(x.email) + '">Nova senha</button>' : '')
        + (String(x.email).toLowerCase() === eu ? '' : '<button class="del" data-a="remover" data-e="' + esc(x.email) + '">Remover acesso</button>') + '</div></td></tr>').join("")
      + '</tbody></table></div><p class="hint" style="margin-top:8px">' + lista.length + ' pessoa(s) com acesso. Remover acesso bloqueia o painel na hora; o login da pessoa no Supabase não é apagado.</p>';
    $("#aLista").onclick = async e => {
      const bt = e.target.closest("button[data-a]"); if (!bt) return;
      const email = bt.dataset.e, a = bt.dataset.a;
      if (a === "remover"){
        if (!confirm("Remover o acesso de " + email + " ao painel?")) return;
        try { await chamarAcessos({ acao:"remover", email }); toast("Acesso removido.", "ok"); renderAcessos(); } catch(err){ toast(err.message, "err"); }
      } else {
        const senha = prompt("Nova senha para " + email + " (mínimo 8 caracteres):", gerarSenha()); if (!senha) return;
        try { await chamarAcessos({ acao:"senha", email, senha });
          ultimoCadastro = "Senha redefinida para <b>" + esc(email) + "</b>.\nLink: " + esc(location.origin + location.pathname) + "\nE-mail: " + esc(email) + "\nSenha: " + esc(senha);
          toast("Senha alterada.", "ok"); renderAcessos(); } catch(err){ toast(err.message, "err"); }
      }
    };
  } catch(e){ $("#aLista").innerHTML = '<p class="hint" style="color:var(--red)">' + esc(e.message) + '</p>'; }
}

function paintAuth(){
  $("#btnLogin").classList.toggle("hidden", logged); $("#btnLogout").classList.toggle("hidden", !logged);
  $("#btnUp").classList.toggle("hidden", !(logged && isAdmin));
  $("#tabAcessos").classList.toggle("hidden", !(logged && isAdmin));
  if (!logged) showEmpty("Acesso restrito", '<p style="color:var(--muted)">Clique em <b>Entrar</b> e use o e-mail e a senha que você recebeu.</p>');
}
async function aoLogar(session){
  logged = !!session;
  if (!logged){ isAdmin = false; S.rows = null; S.loadedAsset = null; S.meta = null; paintAuth(); renderMeta(); return; }
  const [ra, rv] = await Promise.all([sb.rpc("painel_sou_admin"), sb.rpc("painel_posso_ver")]);
  isAdmin = !ra.error && ra.data === true; paintAuth();
  if (!isAdmin && !(rv && !rv.error && rv.data === true)){ showEmpty("Usuário sem acesso a este painel", '<p style="color:var(--muted)">Seu login funcionou, mas seu e-mail ainda não foi liberado. Fale com o responsável.</p>'); return; }
  await syncBase(false);
}
async function syncBase(silent){
  const { data, error } = await sb.from("painel_base_meta").select("*").eq("painel", PAINEL).maybeSingle();
  if (error || !data){ if (!S.rows) showEmpty(isAdmin ? "Carregue a primeira base" : "Nenhuma base publicada ainda", isAdmin ? '<p style="color:var(--muted)">Exporte <b>dbo.C6_CXPJ_HORA_HORA</b> (hoje e os 8 dias anteriores, com a meta) e, se quiser, uma 2ª aba com <b>dbo.C6_CXPJ_HORA_HORA_TAB</b>, e use <b>Atualizar base</b>.</p>' : ""); return; }
  const m = toMeta(data); if (m.path === S.loadedAsset){ S.meta = m; renderMeta(); return; }
  try { const dl = await sb.storage.from(BUCKET).download(m.path); if (dl.error) throw dl.error;
    S.loadedAsset = m.path; load(JSON.parse(await dl.data.text()), m); if (silent) toast("Base atualizada.", "ok"); }
  catch(_){ if (!S.rows) showEmpty("Não foi possível baixar a base", ""); }
}
$("#btnLogin").onclick = () => { $("#lErr").textContent = ""; $("#dlgLogin").showModal(); $("#lEmail").focus(); };
$("#lCancel").onclick = () => $("#dlgLogin").close();
$("#fLogin").onsubmit = async e => { e.preventDefault(); const b = $("#lGo"); b.disabled = true; $("#lErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email:$("#lEmail").value.trim(), password:$("#lPass").value });
  b.disabled = false; if (error){ $("#lErr").textContent = "E-mail ou senha incorretos."; return; } $("#lPass").value = ""; $("#dlgLogin").close(); };
$("#btnLogout").onclick = () => sb.auth.signOut();
(async function init(){
  if (!sb){ $("#btnLogin").classList.add("hidden"); $("#btnLocal").classList.remove("hidden");
    showEmpty("Abra a base", '<p style="color:var(--muted)">Sem conexão com o Supabase: use <b>Abrir arquivo</b> para ver a base só nesta tela.</p>'); return; }
  sb.auth.onAuthStateChange((ev, session) => { if (ev === "SIGNED_IN" || ev === "SIGNED_OUT") setTimeout(() => aoLogar(session), 0); });
  const { data } = await sb.auth.getSession(); await aoLogar(data && data.session);
  setInterval(() => { if (logged && document.visibilityState === "visible") syncBase(true); }, 2 * 60 * 1000);
})();
})();
</script>
